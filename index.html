<html>

<head>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <script src="python-code.js"></script>
    <script src="pyodide-init.js"></script>
    <script src="logic.js"></script>
    <script type="module">
        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.121.1/build/three.module.js";
        import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.121.1/examples/jsm/controls/OrbitControls.js";

        const container = document.getElementById("canvasContainer");
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
        camera.position.z = 4;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        const controls = new OrbitControls(camera, renderer.domElement);

        const light = new THREE.PointLight(0xffffff, 1.2);
        light.position.set(5, 5, 5);
        scene.add(light);

        const ambient = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambient);

        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(1, 64, 64),
            new THREE.MeshPhongMaterial({ color: 0x222222, wireframe: true, transparent: true, opacity: 0.5 })
        );
        scene.add(sphere);

        function axis(dir) {
            return new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(...dir)
                ]),
                new THREE.LineBasicMaterial({ color: 0xffffff })
            );
        }
        scene.add(axis([1.5, 0, 0]));
        scene.add(axis([0, 1.5, 0]));
        scene.add(axis([0, 0, 1.5]));

        /** INitial arrows calculaed using theta0 on top **/
        const arrow1 = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 0), 1, 0xff0000, 0.12, 0.12);
        const arrow2 = new THREE.ArrowHelper(new THREE.Vector3(Math.sin(theta0), 0, Math.cos(theta0)), new THREE.Vector3(0, 0, 0), 1, 0x00ff00, 0.12, 0.12);
        scene.add(arrow1);
        scene.add(arrow2);

        /** These are 'what would have been if there were no entanglement' arrows **/
        const ghostArrow1 = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 0), 1, 0xff0000, 0.12, 0.12);
        ghostArrow1.cone.material.opacity = 0.3;
        ghostArrow1.line.material.opacity = 0.3;
        ghostArrow1.cone.material.transparent = true;
        ghostArrow1.line.material.transparent = true;

        const ghostArrow2 = new THREE.ArrowHelper(new THREE.Vector3(Math.sin(theta0), 0, Math.cos(theta0)), new THREE.Vector3(0, 0, 0), 1, 0x00ff00, 0.12, 0.12);
        ghostArrow2.cone.material.opacity = 0.3;
        ghostArrow2.line.material.opacity = 0.3;
        ghostArrow2.cone.material.transparent = true;
        ghostArrow2.line.material.transparent = true;

        scene.add(ghostArrow1);
        scene.add(ghostArrow2);

        function updateVectors(v1, v2) {
            arrow1.setDirection(new THREE.Vector3(...v1).normalize());
            arrow1.setLength(Math.hypot(...v1));
            arrow2.setDirection(new THREE.Vector3(...v2).normalize());
            arrow2.setLength(Math.hypot(...v2));
        }

        function updateGhostVectorsFromCurrent(v1, v2) {
            ghostArrow1.setDirection(new THREE.Vector3(...v1).normalize());
            ghostArrow1.setLength(1);
            ghostArrow2.setDirection(new THREE.Vector3(...v2).normalize());
            ghostArrow2.setLength(1);
        }

        window.addEventListener('resize', function () {
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</head>

<body>
    <div id="loading">
        Please wait while the application initializes...
    </div>
    <div id="screen">
        <div id="hardcontrolsDiv">
            <table>
                <tr>
                    <td>Qubit #:</td>
                    <td colspan="2">
                        <select id="qubit_index">
                            <option value="0">First</option>
                            <option value="1">Second</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Axis:</td>
                    <td colspan="2">
                        <select id="axis">
                            <option value="x">X</option>
                            <option value="y">Y</option>
                            <option value="z">Z</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Rotation:</td>
                    <td><input type="range" id="rot" min="-360" max="360" value="0" step="1"></td>
                    <td><span id="rot_disp">0</span>&nbsp;degrees</td>
                </tr>
                <tr>
                    <td colspan="3">
                        <input type="button" id="btnApplyRotation" value="Apply" />
                    </td>
                </tr>
            </table>
        </div>
        <div id="entropyDiv">
            <table>
                <tr>
                    <td>Entropy:</td>
                    <td id="entropy">0.00</td>
                </tr>
            </table>
        </div>
        <div id="canvasContainer"></div>
    </div>
    <div id="title">
        Bloch Sphere Hero
    </div>
</body>

</html>
